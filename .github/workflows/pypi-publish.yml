name: PyPI

on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
  workflow_dispatch:

jobs:
  pypi-publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install build tools
        run: pip install hatchling build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Lets a workflow_dispatch re-run (e.g. to retry the registry job
          # below without cutting a new tag) skip a version already on PyPI
          # instead of failing the whole workflow on "File already exists".
          skip-existing: true

  mcp-registry-publish:
    name: Publish to MCP Registry
    runs-on: ubuntu-latest
    needs: pypi-publish
    permissions:
      id-token: write # OIDC — proves this run belongs to entire-vc/evc-team-relay-mcp
      contents: read
    steps:
      - uses: actions/checkout@v7

      - name: Check server.json version matches pyproject.toml
        run: |
          set -euo pipefail
          PY_VERSION=$(grep -m1 '^version' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          SJ_VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['version'])")
          SJ_PKG_VERSION=$(python3 -c "import json; print(json.load(open('server.json'))['packages'][0]['version'])")
          echo "pyproject.toml=$PY_VERSION server.json.version=$SJ_VERSION server.json.packages[0].version=$SJ_PKG_VERSION"
          if [ "$PY_VERSION" != "$SJ_VERSION" ] || [ "$PY_VERSION" != "$SJ_PKG_VERSION" ]; then
            echo "::error::version mismatch — pyproject.toml=$PY_VERSION server.json.version=$SJ_VERSION server.json.packages[0].version=$SJ_PKG_VERSION. Fix both files to the same version before this can publish."
            exit 1
          fi

      - name: Install mcp-publisher
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_$(uname -s | tr '[:upper:]' '[:lower:]')_$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/').tar.gz" | tar xz mcp-publisher

      - name: Authenticate to MCP Registry (GitHub OIDC)
        run: ./mcp-publisher login github-oidc

      - name: Validate server.json
        run: ./mcp-publisher validate

      - name: Publish to MCP Registry
        run: ./mcp-publisher publish
