[project]
name = "evc-team-relay-mcp"
version = "1.0.7"
description = "MCP server for reading and writing Obsidian vault documents via EVC Team Relay"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Entire VC", email = "in@entire.vc"}]
keywords = ["mcp", "obsidian", "relay", "collaboration", "crdt"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # mcp 2.0.0 (2026-07-28) removed mcp.server.fastmcp, which relay_mcp.py
    # imports directly — an unbounded floor here means every fresh install
    # after that date silently resolves a 2.x that cannot start
    # (ModuleNotFoundError). Ceiling it to the 1.x line; migrating to the 2.x
    # API is a separate, deliberately-scoped task (#6ad5f88c).
    "mcp[cli]>=1.0.0,<2",
    "httpx>=0.27.0",
]

[project.urls]
Homepage = "https://entire.vc/team-relay/"
Repository = "https://github.com/entire-vc/evc-team-relay-mcp"
Issues = "https://github.com/entire-vc/evc-team-relay-mcp/issues"

[project.scripts]
evc-team-relay-mcp = "relay_mcp:main"
relay-mcp = "relay_mcp:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["."]
only-include = ["relay_mcp.py"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
